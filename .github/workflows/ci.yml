name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  scratch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack plugin
        run: npm pack --pack-destination tests/scratch-site

      - name: Install scratch site dependencies
        working-directory: tests/scratch-site
        run: npm install

      - name: Install packed plugin
        working-directory: tests/scratch-site
        run: npm install --no-save './*.tgz'

      - name: Build scratch site against real Starlight
        working-directory: tests/scratch-site
        run: npm run build

      - name: Inspect dist output
        working-directory: tests/scratch-site
        run: |
          # Reading progress bar must be rendered into every page.
          grep -q 'id="reading-progress"' dist/index.html
          grep -q 'id="reading-progress"' dist/guide/one/index.html
          # Collapsible TOC must replace the default TOC with real entries.
          grep -q 'starlight-toc-collapsible' dist/guide/one/index.html
          grep -q 'href="#section-a"' dist/guide/one/index.html
